{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "petclinic.mysql.fullname" . }}
  labels:
    {{- include "petclinic.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    {{- if kindIs "string" .Values.externalSecret.secretStoreRef }}
    name: {{ .Values.externalSecret.secretStoreRef }}
    kind: ClusterSecretStore
    {{- else }}
    name: {{ .Values.externalSecret.secretStoreRef.name | default "aws-secrets-manager" }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind | default "ClusterSecretStore" }}
    {{- end }}
  target:
    name: {{ include "petclinic.mysql.fullname" . }}
    creationPolicy: Owner
  {{- if .Values.externalSecret.data }}
  data:
    {{- toYaml .Values.externalSecret.data | nindent 4 }}
  {{- end }}
  {{- if .Values.externalSecret.dataFrom }}
  dataFrom:
    {{- toYaml .Values.externalSecret.dataFrom | nindent 4 }}
  {{- end }}
{{- end }}

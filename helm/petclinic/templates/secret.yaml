{{- if and (not .Values.mysql.auth.existingSecret) (not .Values.externalSecret.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "petclinic.mysql.fullname" . }}
  labels:
    {{- include "petclinic.labels" . | nindent 4 }}
type: Opaque
stringData:
  mysql-password: {{ .Values.mysql.auth.password | quote }}
  mysql-root-password: {{ .Values.mysql.auth.rootPassword | quote }}
{{- end }}

replicaCount: 1

image:
  repository: springio/petclinic
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

rbac:
  # Creates a namespace-scoped Role/RoleBinding for the application ServiceAccount.
  create: true
  rules:
    - apiGroups: [""]
      resources: ["configmaps", "secrets"]
      verbs: ["get", "list", "watch"]

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1001

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: petclinic.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false

resources:
  requests:
    cpu: 250m
    memory: 768Mi
  limits:
    cpu: "1"
    memory: 860Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  # Guards against Karpenter/cluster-autoscaler node drains evicting all replicas at once.
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1  # use instead of minAvailable if preferred

serviceMonitor:
  # Requires the Prometheus Operator CRDs to be installed in the cluster.
  enabled: false
  namespace: ""
  interval: 30s
  scrapeTimeout: 10s
  path: /actuator/prometheus
  labels: {}

networkPolicy:
  enabled: true
  # Extra namespaces (e.g. an ingress-controller namespace) allowed to reach the app on service.port.
  additionalIngressNamespaceLabels: []

externalSecret:
  # Requires the External Secrets Operator (ESO) CRDs to be installed in the cluster.
  # When enabled, this chart no longer creates templates/secret.yaml; instead an
  # ExternalSecret resource syncs mysql-password/mysql-root-password from the
  # referenced SecretStore/ClusterSecretStore into a Kubernetes Secret.
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    name: ""
    kind: SecretStore
  data:
    - secretKey: mysql-password
      remoteRef:
        key: petclinic/mysql
        property: password
    - secretKey: mysql-root-password
      remoteRef:
        key: petclinic/mysql
        property: rootPassword

nodeSelector: {}
tolerations: []
affinity: {}

mysql:
  image:
    repository: mysql
    tag: "8.4"
    pullPolicy: IfNotPresent
  auth:
    database: petclinic
    username: petclinic
    password: changeme
    rootPassword: changeme-root
    existingSecret: ""
  storage:
    size: 1Gi
    storageClass: "ebs-gp3"
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 512Mi
  securityContext:
    allowPrivilegeEscalation: false
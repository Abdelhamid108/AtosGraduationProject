# Environment-specific overrides for charts/petclinic in 'prod'.
# image.tag here is written by the Jenkins 'promotion' pipeline (test -> prod)
# via gitops/updateValues.groovy — same convention as dev/test.

workloadType: Deployment

replicaCount: 3

image:
  repository: "069089526123.dkr.ecr.us-east-1.amazonaws.com/petclinic-project/petclinitc-app"
  tag: "1.0.0"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  host: "<REPLACE_ME_PROD_DOMAIN>"     # e.g. petclinic.example.com
  certificateArn: "<REPLACE_ME_ACM_CERT_ARN>"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 2

persistence:
  enabled: false

networkPolicy:
  enabled: true

externalSecret:
  enabled: true
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  data: []
  dataFrom:
    - extract:
        key: "atos/petclinic/prod/mysql"

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

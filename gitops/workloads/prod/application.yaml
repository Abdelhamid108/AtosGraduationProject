apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: petclinic-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd-image-updater.argoproj.io/image-list: petclinic=069089526123.dkr.ecr.us-east-1.amazonaws.com/petclinic-project/petclinitc-app
    argocd-image-updater.argoproj.io/petclinic.update-strategy: latest
    argocd-image-updater.argoproj.io/petclinic.allow-tags: regexp:^prod-.*$
    argocd-image-updater.argoproj.io/petclinic.helm.image-name: image.repository
    argocd-image-updater.argoproj.io/petclinic.helm.image-tag: image.tag
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/write-back-target: helmvalues:gitops/workloads/prod/values.yaml
spec:
  project: workload-project
  source:
    repoURL: "https://github.com/Abdelhamid108/AtosGraduationProject.git"
    targetRevision: main
    path: helm/petclinic
    helm:
      releaseName: petclinic-prod
      valueFiles:
        - ../../gitops/workloads/prod/values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: petclinic-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true

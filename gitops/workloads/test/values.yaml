# Environment-specific overrides for charts/petclinic in 'test'.
# image.tag here is written by the Jenkins 'promotion' pipeline (dev -> test)
# via gitops/updateValues.groovy — same convention as dev/values.yaml.

workloadType: Deployment

replicaCount: 2

image:
  repository: "069089526123.dkr.ecr.us-east-1.amazonaws.com/petclinic-project/petclinitc-app"
  tag: "1.0.0"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
    alb.ingress.kubernetes.io/success-codes: "200,302"
  hosts: []

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

persistence:
  enabled: false

networkPolicy:
  enabled: true

serviceMonitor:
  enabled: true

externalSecret:
  enabled: true
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  data: []
  dataFrom:
    - extract:
        key: "atos/petclinic/test/mysql"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

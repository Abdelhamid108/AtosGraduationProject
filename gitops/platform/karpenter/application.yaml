apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform-project
  sources:
    - repoURL: oci://public.ecr.aws/karpenter
      chart: karpenter-crd
      targetRevision: 1.0.6
      helm:
        releaseName: karpenter-crd
    - repoURL: oci://public.ecr.aws/karpenter
      chart: karpenter
      targetRevision: 1.0.6
      helm:
        releaseName: karpenter
        valuesObject:
          settings:
            clusterName: "atos-eks-cluster"
            interruptionQueue: "atos-eks-cluster-karpenter"
          serviceAccount:
            create: true
            name: karpenter
            # Pod Identity, not IRSA — same note as the ALB controller.
  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-nodepools
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform-project
  source:
    repoURL: "https://github.com/Abdelhamid108/AtosGraduationProject.git"
    targetRevision: main
    path: gitops/platform/karpenter
    directory:
      include: "nodepool.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true

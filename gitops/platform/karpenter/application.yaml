apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
spec:
  project: platform-project
  sources:
    - repoURL: https://charts.karpenter.sh
      chart: karpenter
      targetRevision: 1.0.6
      helm:
        releaseName: karpenter
        valuesObject:
          settings:
            clusterName: "atos-eks-cluster"
            interruptionQueue: "atos-eks-cluster-karpenter"
          serviceAccount:
            create: true
            name: karpenter
            # Pod Identity, not IRSA — same note as the ALB controller.
    - repoURL: "https://github.com/Abdelhamid108/AtosGraduationProject.git"
      targetRevision: main
      path: gitops/platform/karpenter
      directory:
        include: "nodepool.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

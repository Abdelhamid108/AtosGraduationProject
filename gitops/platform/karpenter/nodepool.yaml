# NodePool/EC2NodeClass depend on Karpenter's own CRDs (installed by the
# Helm chart source in the same Application, at the default sync-wave "0").
# The sync-wave "1" annotation here makes Argo CD apply these only after
# that first wave completes.
#
# KNOWN LIMITATION: sync-wave ordering waits for the previous wave's
# resources to finish syncing, not for CRDs to be fully API-established.
# In practice CRD registration is fast enough that this doesn't race — but
# if you ever see "no matches for kind NodePool" on a from-scratch sync,
# just re-sync the Application; it resolves itself once the CRD is
# registered. The more bulletproof fix is splitting this into its own
# Application with an app-level sync-wave, at the cost of one more file.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  template:
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
  limits:
    cpu: "100"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  amiFamily: AL2023
  role: "<REPLACE_ME_KARPENTER_NODE_ROLE_NAME>"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "<REPLACE_ME_CLUSTER_NAME>"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "<REPLACE_ME_CLUSTER_NAME>"

# Depends on the External Secrets Operator CRDs installed by the Helm
# source in the same Application — see the sync-wave note in
# platform/karpenter/nodepool.yaml, same reasoning applies here.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    aws:
      service: SecretsManager
      region: "us-east-1"
      # No 'auth' block: Pod Identity supplies credentials via the default
      # AWS SDK credential chain automatically — nothing to configure here.
      # If this project ever switches to IRSA, add:
      #   auth:
      #     jwt:
      #       serviceAccountRef:
      #         name: external-secrets
      #         namespace: external-secrets

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
spec:
  project: platform-project
  source:
    repoURL: https://aws.github.io/eks-charts
    chart: aws-load-balancer-controller
    targetRevision: 1.8.1
    helm:
      releaseName: aws-load-balancer-controller
      valuesObject:
        clusterName: "atos-eks-cluster"
        region: "us-east-1"
        vpcId: "vpc-0b83d9e1179c2e06e"
        serviceAccount:
          create: true
          name: aws-load-balancer-controller
          # No IRSA annotation on purpose — a Pod Identity Association
          # (created in Terraform) binds this ServiceAccount's
          # name+namespace to an IAM role directly.
        replicaCount: 2
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

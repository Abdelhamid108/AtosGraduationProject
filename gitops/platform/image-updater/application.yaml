apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform-project
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argocd-image-updater
    targetRevision: 0.11.0 # Current stable version
    helm:
      values: |
        config:
          registries:
            - name: ECR
              api_url: https://069089526123.dkr.ecr.us-east-1.amazonaws.com
              prefix: 069089526123.dkr.ecr.us-east-1.amazonaws.com
              ping: yes
        auth:
          # This allows the updater to use the IAM Role we created in Terraform
          serviceAccount:
            create: true
            name: argocd-image-updater
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

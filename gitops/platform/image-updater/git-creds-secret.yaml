apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: repo-atosgraduationproject
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: repo-atosgraduationproject
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: "git"
        url: "https://github.com/Abdelhamid108/AtosGraduationProject.git"
        username: "{{ .username }}"
        password: "{{ .token }}"
  data:
    - secretKey: username
      remoteRef:
        key: atos/petclinic/git-creds
        property: username
    - secretKey: token
      remoteRef:
        key: atos/petclinic/git-creds
        property: token

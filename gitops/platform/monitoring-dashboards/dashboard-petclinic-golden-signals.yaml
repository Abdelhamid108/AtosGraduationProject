apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-petclinic-golden-signals
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  petclinic-golden-signals.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "title": "Four Golden Signals (Google SRE)",
          "type": "row"
        },
        {
          "title": "Traffic (HTTP Requests / Sec)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
          "id": 1,
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{namespace=~\"$namespace\", uri!~\"/actuator.*\"}[1m])) by (method, uri)",
              "legendFormat": "{{method}} {{uri}}"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "reqps" }
          }
        },
        {
          "title": "Errors (HTTP 5xx & 4xx Rates)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 1 },
          "id": 2,
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{namespace=~\"$namespace\", status=~\"5..\", uri!~\"/actuator.*\"}[1m]))",
              "legendFormat": "HTTP 5xx (Server Errors)"
            },
            {
              "expr": "sum(rate(http_server_requests_seconds_count{namespace=~\"$namespace\", status=~\"4..\", uri!~\"/actuator.*\"}[1m]))",
              "legendFormat": "HTTP 4xx (Client Errors)"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "reqps" }
          }
        },
        {
          "title": "Latency Percentiles (P50, P90, P95, P99)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 9 },
          "id": 3,
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_server_requests_seconds_bucket{namespace=~\"$namespace\", uri!~\"/actuator.*\"}[5m])) by (le))",
              "legendFormat": "p50 (Median)"
            },
            {
              "expr": "histogram_quantile(0.90, sum(rate(http_server_requests_seconds_bucket{namespace=~\"$namespace\", uri!~\"/actuator.*\"}[5m])) by (le))",
              "legendFormat": "p90"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{namespace=~\"$namespace\", uri!~\"/actuator.*\"}[5m])) by (le))",
              "legendFormat": "p95 (SLO Target: 500ms)"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{namespace=~\"$namespace\", uri!~\"/actuator.*\"}[5m])) by (le))",
              "legendFormat": "p99 (Tail)"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "s" }
          }
        },
        {
          "title": "Saturation (HikariCP DB Pool & JVM Heap)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 9 },
          "id": 4,
          "targets": [
            {
              "expr": "(sum(hikaricp_connections_active{namespace=~\"$namespace\"}) / clamp_min(sum(hikaricp_connections_max{namespace=~\"$namespace\"}), 1)) * 100",
              "legendFormat": "HikariCP Pool %"
            },
            {
              "expr": "(sum(jvm_memory_used_bytes{namespace=~\"$namespace\", area=\"heap\"}) / clamp_min(sum(jvm_memory_max_bytes{namespace=~\"$namespace\", area=\"heap\"}), 1)) * 100",
              "legendFormat": "JVM Heap Utilization %"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "percent", "max": 100, "min": 0 }
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 17 },
          "id": 101,
          "title": "Business KPIs & Conversions",
          "type": "row"
        },
        {
          "title": "Business Registrations Rate (Owners, Pets, Visits)",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 24, "x": 0, "y": 18 },
          "id": 5,
          "targets": [
            {
              "expr": "sum(rate(petclinic_owners_created_total{namespace=~\"$namespace\"}[5m])) * 60",
              "legendFormat": "New Owners Created / min"
            },
            {
              "expr": "sum(rate(petclinic_pets_created_total{namespace=~\"$namespace\"}[5m])) * 60",
              "legendFormat": "New Pets Registered / min"
            },
            {
              "expr": "sum(rate(petclinic_visits_created_total{namespace=~\"$namespace\"}[5m])) * 60",
              "legendFormat": "Visits Booked / min"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "events/min" }
          }
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["petclinic", "sre", "golden-signals"],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(http_server_requests_seconds_count, namespace)",
            "refresh": 1,
            "includeAll": true,
            "multi": false,
            "current": { "selected": true, "text": "petclinic-prod", "value": "petclinic-prod" }
          }
        ]
      },
      "time": { "from": "now-1h", "to": "now" },
      "title": "PetClinic / Four Golden Signals",
      "uid": "petclinic-golden-signals"
    }

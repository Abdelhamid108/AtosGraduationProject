apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-petclinic-slo-error-budget
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  petclinic-slo-error-budget.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 200,
          "title": "99.9% SLA & Error Budget Status",
          "type": "row"
        },
        {
          "title": "30-Day Rolling Availability (SLA Target: 99.9%)",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 1 },
          "id": 10,
          "targets": [
            {
              "expr": "service:http_sla_compliance:ratio30d{namespace=~\"$namespace\"} * 100",
              "legendFormat": "Current 30d SLA"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 99.0,
              "max": 100.0,
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 99.8 },
                  { "color": "green", "value": 99.9 }
                ]
              }
            }
          }
        },
        {
          "title": "Remaining 30-Day Error Budget (%)",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 1 },
          "id": 11,
          "targets": [
            {
              "expr": "service:http_error_budget_remaining:percent{namespace=~\"$namespace\"}",
              "legendFormat": "Remaining Budget"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 100,
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 20 },
                  { "color": "green", "value": 50 }
                ]
              }
            }
          }
        },
        {
          "title": "Remaining Allowable Downtime (Minutes)",
          "type": "stat",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 1 },
          "id": 12,
          "targets": [
            {
              "expr": "service:http_error_budget_minutes_remaining{namespace=~\"$namespace\"}",
              "legendFormat": "Minutes Left (of 43.2 min)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "m",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 10 },
                  { "color": "green", "value": 25 }
                ]
              }
            }
          }
        },
        {
          "title": "30-Day Error Budget Burn Down Curve",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 16, "x": 0, "y": 9 },
          "id": 13,
          "targets": [
            {
              "expr": "service:http_error_budget_remaining:percent{namespace=~\"$namespace\"}",
              "legendFormat": "Actual Remaining Error Budget %"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "percent", "min": 0, "max": 100 }
          }
        },
        {
          "title": "Multi-Window Error Burn Rates",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 9 },
          "id": 14,
          "targets": [
            {
              "expr": "service:http_availability:burn_rate1h{namespace=~\"$namespace\"}",
              "legendFormat": "1h Burn Rate (Critical: >14.4x)"
            },
            {
              "expr": "service:http_availability:burn_rate6h{namespace=~\"$namespace\"}",
              "legendFormat": "6h Burn Rate (Warning: >6.0x)"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "none" }
          }
        },
        {
          "title": "HTTP 5xx Error Breakdown by Endpoint",
          "type": "table",
          "gridPos": { "h": 7, "w": 24, "x": 0, "y": 17 },
          "id": 15,
          "targets": [
            {
              "expr": "topk(10, sum(increase(http_server_requests_seconds_count{namespace=~\"$namespace\", status=~\"5..\", uri!~\"/actuator.*\"}[1h])) by (uri, status))",
              "format": "table",
              "instant": true
            }
          ]
        }
      ],
      "refresh": "30s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["petclinic", "sre", "slo", "error-budget"],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(service:http_sla_compliance:ratio30d, namespace)",
            "refresh": 1,
            "includeAll": false,
            "multi": false,
            "current": { "selected": true, "text": "petclinic-prod", "value": "petclinic-prod" }
          }
        ]
      },
      "time": { "from": "now-30d", "to": "now" },
      "title": "PetClinic / 99.9% SLO & Error Budget",
      "uid": "petclinic-slo-error-budget"
    }

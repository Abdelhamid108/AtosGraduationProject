apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "petclinic.fullname" . }}-test-connection"
  labels:
    {{- include "petclinic.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: curl
      image: curlimages/curl:8.7.1
      command:
        - curl
        - --silent
        - --fail
        - "http://{{ include "petclinic.fullname" . }}:{{ .Values.service.port }}/actuator/health"
  restartPolicy: Never

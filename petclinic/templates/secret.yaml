{{- if not .Values.mysql.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "petclinic.mysql.fullname" . }}
  labels:
    {{- include "petclinic.labels" . | nindent 4 }}
  annotations:
    # Prevent Helm from replacing an already-deployed Secret on upgrade so that
    # a password rotation does not require a chart change.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  mysql-password: {{ .Values.mysql.auth.password | quote }}
  mysql-root-password: {{ .Values.mysql.auth.rootPassword | quote }}
{{- end }}
